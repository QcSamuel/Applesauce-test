name: Build Applesauce TrollStore Permanent JIT

on:
  workflow_dispatch:

jobs:
  build-trollstore-permanent-jit:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ios-host
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install cmake ninja boost ldid
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Build shared SDL2 for iPhoneOS
        run: |
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build Applesauce iOS app
        run: |
          export TOUCHHLE_BOOST_ROOT="$(brew --prefix boost)/include"
          sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package TrollStore permanent-JIT IPA
        run: |
          sh platform/ios/scripts/package-ipa.sh --trollstore-permanent-jit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-iOS-TrollStore-PermanentJIT
          path: |
            dist/Applesauce-iOS-trollstore-permanent-jit.ipa
            dist/Applesauce-iOS-trollstore-permanent-jit.ipa.sha256
